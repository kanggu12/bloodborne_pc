# The fork's own checks. This file lives on dev only, it is not part of any pull request.
# A push to dev runs it, and so does `gh workflow run dev-ci.yml --ref dev -f ref=<branch>` for a
# contribution branch, which has no copy of this file itself.
name: dev CI

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        default: dev

# A newer run of the same ref replaces one still going.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The launcher is frozen with this Python (PYTHON_VERSION in packaging/windows/package.sh).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Packages the launcher imports
        run: python -m pip install --disable-pip-version-check pillow
      # The tests that need no window. The runner has no graphics card, only Windows' software renderer,
      # and one test looks at this PC's cards: it counts as known here, nowhere else.
      - name: Launcher check
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'tools')
          import check_launcher
          check_launcher.KNOWN['test_vulkan_check.ThisPcTests.test_windows_lists_its_cards'] = 'no graphics card on the runner'
          sys.argv = ['check_launcher.py', '--quick']
          sys.exit(check_launcher.main())

  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14'
      # The pacman line of packaging/windows/README.md.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-miniupnpc mingw-w64-clang-x86_64-nlohmann-json
      # msys2-env.sh puts C:/msys64 first on PATH unless told otherwise, and the runner has one of its own
      # without these packages: this points it at the one the step above set up, for the later steps too.
      - name: Which MSYS2
        shell: msys2 {0}
        run: echo "MSYS2_ROOT=$(cygpath -u "$(cygpath -m /)")" >> "$GITHUB_ENV"
      - name: Build
        shell: msys2 {0}
        run: bash build.sh
      # Only the tests that come with these contributions: a branch has the ones it added.
      - name: Tests
        shell: msys2 {0}
        run: |
          targets=$(grep -oE 'add_executable\((copy-shader|flip-tail|frame-rate|hang-snapshot|render-cache|motion-cache|command-buffer)-test' gpu/CMakeLists.txt | sed 's/add_executable(//')
          for target in $targets; do
            cmake --build out/gpu --target "$target"
            "$(find out/gpu -maxdepth 2 -name "$target.exe" | head -1)"
          done
      # The ZIP a clone gets. Without NVIDIA's DLSS files and the FSR 4 assets, as the README says.
      - name: Package
        shell: msys2 {0}
        env:
          WINPYTHON: ${{ steps.python.outputs.python-path }}
        run: bash packaging/windows/package.sh --zip-only
      - uses: actions/upload-artifact@v4
        with:
          name: bbport-windows-${{ inputs.ref || github.ref_name }}
          path: dist/bbport-windows.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gpu-build-log
          path: out/gpu-build.log
          retention-days: 7
